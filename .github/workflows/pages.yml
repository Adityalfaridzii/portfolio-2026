name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish only what is meant to be public. audit.mjs, _build/ and the
      # markdown notes stay in the repository but never reach the site.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html amb-copilot.html qa-dashboard.html automation.html \
             traveloka-automation.html traveloka-identity.html cv.html _site/
          cp -r assets _site/assets
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
